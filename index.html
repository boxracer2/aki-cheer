<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Add the AKI Cheer 2026 JV and Varsity calendar to your phone in one tap.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D0F">
<title>AKI Cheer Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0D0F'/%3E%3Cpath d='M7 13h4l11-6v18l-11-6H7z' fill='%2320C4C4'/%3E%3Cpath d='M11 19l2 6h3l-2-6' fill='%23E8417E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: black school-color hero with uniform chevrons, then one phone-width column.
   School colors turquoise and black (aki.kyrene.org history page); pink is the calendar's own color on phones. */
:root{
  --black:#0B0D0F; --turq:#12A5A5; --turq-hi:#20C4C4; --pink:#E8417E; --pink-ink:#FFFFFF; --white:#FFFFFF;
  --ground:#EEF5F5; --panel:#FFFFFF; --ink:#0F1416; --muted:#4F5C60; --line:#CFE0E0; --label:#0E8585;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --ground:#0B0D0F; --panel:#151A1C; --ink:#ECF3F3; --muted:#A2B0B3; --line:#263034; --label:#2FD3D3; --pink:#FF5C96; --pink-ink:#16060C; color-scheme:dark; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.5 var(--body)}
[hidden]{display:none!important}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.col{max-width:520px;margin:0 auto}

/* Hero */
.hero{position:relative;background:var(--black);color:var(--white);overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.hero::before{ /* Rattler diamond pattern */
  content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;
  background-image:linear-gradient(45deg,var(--turq) 25%,transparent 25%,transparent 75%,var(--turq) 75%),
                   linear-gradient(45deg,var(--turq) 25%,transparent 25%,transparent 75%,var(--turq) 75%);
  background-size:28px 28px;background-position:0 0,14px 14px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 85%);mask-image:linear-gradient(180deg,#000 0%,transparent 85%);
}
.hero-in{position:relative;padding-block:30px 64px;display:grid;gap:14px}
.eyebrow{display:flex;align-items:center;gap:10px;font:700 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--turq-hi)}
.eyebrow svg{flex:none}
h1{margin:0;font:900 clamp(52px,15vw,76px)/.88 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h1 .yr{color:var(--pink)}
.lede{margin:0;color:#C9D6D8;max-width:40ch}
.spark{position:absolute;pointer-events:none}
.chev{position:absolute;left:0;bottom:-1px;width:100%;height:44px;display:block}

/* Body */
main.col{display:grid;gap:22px;padding-block:22px 44px}
.go{display:grid;gap:10px;margin-top:-40px;position:relative}
a.big{display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px;padding:16px 20px;border-radius:18px;
  background:var(--pink);color:var(--pink-ink);text-decoration:none;font:900 27px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;text-align:center;
  box-shadow:0 10px 24px -10px rgba(232,65,126,.65), inset 0 -4px 0 rgba(0,0,0,.14), inset 0 0 0 3px rgba(255,255,255,.18)}
a.big svg{flex:none}
a.big:focus-visible,a.alt:focus-visible,button:focus-visible{outline:3px solid var(--turq-hi);outline-offset:3px}
.note{font-size:15px;color:var(--muted);text-align:center;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.panel h2{margin:0;font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:10px;height:10px;background:var(--turq);transform:rotate(45deg);flex:none}
ol{margin:0;padding-left:22px;display:grid;gap:8px}
.copyrow{display:flex;gap:8px;flex-wrap:wrap}
.copyrow input{flex:1 1 200px;min-width:0;font:14px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink)}
button{font:700 15px/1 var(--body);padding:12px 16px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.ok{border-color:var(--label);color:var(--label)}
.alts{display:grid;gap:10px}
a.alt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--turq);background:var(--panel);color:var(--ink);text-decoration:none;font-weight:700}
a.alt small{font-weight:400;color:var(--muted);white-space:nowrap}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:15px}
.facts dt{font:700 16px/1.45 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--label);white-space:nowrap}
.facts dd{margin:0;min-width:0}
footer{font-size:14px;color:var(--muted);display:grid;gap:8px;border-top:2px solid var(--line);padding-top:16px}
.go-rattlers{font:900 20px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--label);padding-top:6px}
@media (prefers-reduced-motion: no-preference){
  a.big{transition:transform .12s ease}
  a.big:active{transform:scale(.98)}
  .spark{animation:twinkle 2.6s ease-in-out infinite}
  .spark.s2{animation-delay:.9s}.spark.s3{animation-delay:1.7s}
  @keyframes twinkle{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
}

.lock{margin-top:-40px;position:relative}
.lock input{font:17px/1.3 var(--body)}
.err{margin:0;color:var(--pink);font-weight:700}
</style>
</head>
<body>

<header class="hero">
  <!-- pom-pom sparkles -->
  <svg class="spark s1" style="right:18px;top:26px" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.2 7.8L22 11l-7.8 2.2L12 21l-2.2-7.8L2 11l7.8-2.2z" fill="#E8417E"/></svg>
  <svg class="spark s2" style="right:58px;top:12px" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.2 7.8L22 11l-7.8 2.2L12 21l-2.2-7.8L2 11l7.8-2.2z" fill="#20C4C4"/></svg>
  <svg class="spark s3" style="right:46px;top:44px" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.2 7.8L22 11l-7.8 2.2L12 21l-2.2-7.8L2 11l7.8-2.2z" fill="#FFFFFF"/></svg>
  <div class="gutter">
    <div class="col hero-in">
      <div class="eyebrow">
        <svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><path d="M2 7h5l13-6v18L7 13H2z" fill="#20C4C4"/><path d="M7 13l2 6h3l-2-6" fill="#E8417E"/></svg>
        Go Rattlers &middot; JV &amp; Varsity
      </div>
      <h1>AKI Cheer <span class="yr">2026</span></h1>
      <p class="lede">Every practice, game day, and event on your phone. Add it once and any changes show up on their own.</p>
    </div>
  </div>
  <!-- uniform chevrons: turquoise, pink, then the page ground -->
  <svg class="chev" viewBox="0 0 400 44" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 4 L200 30 L400 4 L400 44 L0 44 Z" fill="#12A5A5"/>
    <path d="M0 14 L200 38 L400 14 L400 44 L0 44 Z" fill="#E8417E"/>
    <path d="M0 22 L200 44 L400 22 L400 44 L0 44 Z" style="fill:var(--ground)"/>
  </svg>
</header>

<div class="gutter">
<main class="col">
  <form class="lock panel" id="lock" autocomplete="on">
    <h2>Team code</h2>
    <p style="margin:0">Enter the cheer team's Google Classroom class code to see the calendar links.</p>
    <div class="copyrow">
      <input id="pc" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Class code" aria-label="Google Classroom class code" required>
      <button type="submit" id="unlockBtn">Open</button>
    </div>
    <p class="err" id="err" hidden>That code didn't work. Check the spelling and try again.</p>
  </form>
</main>
</div>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const KEY = "akiCheerCode";
  async function open(pass){
    const raw = new TextEncoder().encode(pass.trim().toLowerCase());
    const base = await crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
    return new TextDecoder().decode(pt);
  }
  function show(html){
    const main = document.querySelector("main.col");
    main.innerHTML = html; wire();
  }
  function wire(){
    const ua = navigator.userAgent || "";
    const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const android = /Android/.test(ua);
    const primary = $("primary");
    if (ios) {
      primary.href = $("altApple").href; primary.removeAttribute("target");
      $("primaryLabel").textContent = "Add to iPhone Calendar";
      $("primaryNote").textContent = "Tap Subscribe when your iPhone asks.";
      $("altApple").hidden = true; $("androidHelp").hidden = true;
    } else if (android) {
      $("altGoogle").hidden = true; $("iphoneHelp").hidden = true;
    } else {
      $("altGoogle").hidden = true; $("androidHelp").hidden = true;
    }
    for (const [btnId, inputId] of [["copyIcs","icsLink"],["copyEmail","emailAddr"]]) {
      const b = $(btnId), i = $(inputId), label = b.textContent;
      b.addEventListener("click", () => {
        const done = () => { b.textContent = "Copied"; b.classList.add("ok"); setTimeout(() => { b.textContent = label; b.classList.remove("ok"); }, 2000); };
        const fallback = () => { i.focus(); i.select(); try { if (document.execCommand("copy")) done(); } catch (e) {} };
        try { navigator.clipboard.writeText(i.value).then(done, fallback); } catch (e) { fallback(); }
      });
    }
  }
  $("lock").addEventListener("submit", async ev => {
    ev.preventDefault();
    const btn = $("unlockBtn"); btn.disabled = true; btn.textContent = "Opening"; $("err").hidden = true;
    try { const html = await open($("pc").value); try { localStorage.setItem(KEY, $("pc").value.trim().toLowerCase()); } catch (e) {} show(html); }
    catch (e) { $("err").hidden = false; btn.disabled = false; btn.textContent = "Open"; $("pc").select(); }
  });
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved).then(show, () => { try { localStorage.removeItem(KEY); } catch (e) {} });
})();
